<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>Workout Tracker v7</title>
<style>
:root{--bg:#0b1220;--text:#e5e7eb;--header:#020617;--card:#111827;--line:#1f2937;--muted:#94a3b8;--inputBg:#0f172a;--inputBorder:#334155;--btn:#2563eb;--btnText:#fff;--btnAlt:#1f2937;--btnAltText:#e5e7eb;--surface:#0f172a;--okBg:#052e1a;--okText:#86efac}
body.day{--bg:#f3f4f6;--text:#111827;--header:#111827;--card:#fff;--line:#eee;--muted:#6b7280;--inputBg:#fff;--inputBorder:#d1d5db;--btn:#111827;--btnText:#fff;--btnAlt:#e5e7eb;--btnAltText:#111827;--surface:#f8fafc;--okBg:#ecfdf5;--okText:#166534}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
header{background:var(--header);color:#fff;padding:18px}main{max-width:820px;margin:auto;padding:14px}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0002}
.exercise{border-top:1px solid var(--line);padding:15px 0}.exercise:first-child{border:0}

h1,h2,h3{margin:0 0 8px}.muted{color:var(--muted);font-size:13px}
input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--inputBorder);border-radius:9px;font:inherit;margin-top:4px;background:var(--inputBg);color:var(--text)}
button{padding:10px 12px;border:0;border-radius:10px;background:var(--btn);color:var(--btnText);font-weight:600}
button.alt{background:var(--btnAlt);color:var(--btnAltText)}#themeToggle{width:auto;padding:8px 10px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.row button{flex:1}
.timer{text-align:center;font-size:42px;font-variant-numeric:tabular-nums;padding:7px}
.timerbox{background:var(--surface);border-radius:12px;padding:10px;margin-top:9px}
.setrow{display:grid;grid-template-columns:1fr 100px 80px;gap:8px;align-items:end;margin:7px 0}
.ok{background:var(--okBg);color:var(--okText);padding:11px;border-radius:10px;margin-top:10px}
#history{max-height:420px;overflow:auto;padding-right:4px}
.history{border-top:1px solid var(--line);padding:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center;background:var(--surface);padding:10px;border-radius:10px}.stat b{display:block;font-size:20px}
.tempo{background:var(--surface);padding:9px;border-radius:9px;margin:7px 0}
.trendbox{margin-top:10px}.trendbox select{max-width:320px}
.filterrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.linechart{height:190px;background:var(--surface);border-radius:10px;padding:8px;overflow:auto}
.linechart svg{display:block}.legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--inputBg);border:1px solid var(--inputBorder);font-size:11px;color:var(--text)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.editing{margin-top:8px;padding:8px;border-radius:8px;background:var(--surface);font-size:13px}
@media(max-width:520px){.setrow{grid-template-columns:1fr 80px 70px}}
</style></head>
<body>
<header><div class="header-top"><h1>Workout Tracker</h1><button id="themeToggle" class="alt" type="button">☀️ Day</button></div><div id="date"></div></header>
<main>
<section class="card"><h2 id="dayTitle"></h2><div id="dayMeta" class="muted"></div>
<select id="dayPick" style="margin-top:10px"></select></section>

<section class="card"><h2>Today's Circuit</h2><div id="workout"></div>
<button id="save">✓ DONE — SAVE WORKOUT</button><button id="cancelEdit" class="alt" style="margin-top:8px;display:none">Cancel Edit Mode</button><div id="msg"></div></section>

<section class="card"><h2>⚙️ Editable Default Settings</h2><div id="settings"></div>
<button id="saveSettings">Save Default Settings</button>
<p class="muted">Defaults are separate from workout history. Rep defaults start at 4, then adapt by +1 every 3 completed sessions and -1 every 2 skipped sessions (per day/exercise).</p></section>

<section class="card"><h2>Progress</h2><div id="stats" class="stats"></div><div class="filterrow"><label>Day<select id="progressDay"></select></label><label>From<input id="fromDate" type="date"></label><label>To<input id="toDate" type="date"></label></div><div id="progress"></div></section>
<section class="card"><h2>History</h2><div id="history"></div></section>
<section class="card"><h2>Data</h2><div class="row"><button id="export">Export</button><button id="import" class="alt">Import</button><button id="demoData" class="alt">Add 3 Weeks Demo</button><button id="clear" class="alt">Clear</button></div>
<input id="file" type="file" accept="application/json" hidden><p class="muted">Results stay in this browser.</p></section>
</main>

<script>
const PROGRAM={
1:{name:"UPPER V-TAPER & SHOULDERS",rounds:4,rest:90,items:[
["Pull-Ups (Overhand)","reps",4,8,"2s pull up → 1s hold at bar → 2s lowering down","Work 30–35s · Active Recovery 45s Skipping · Transition 15s"],
["Pike Push-Ups","reps",8,10,"2s lowering head to floor → 1s bottom hold → 2s press up","Work 30–35s · Active Recovery 45s Skipping · Transition 15s"],
["Decline Feet-Elevated Push-Ups","reps",10,12,"2s lowering chest to floor → 1s bottom hold → 1s press up","Work 35–40s · Active Recovery 45s Skipping · Transition 15s"],
["Hanging Leg / Knee Raise Hold","time",30,30,"Continuous static isometric contraction at 90 degrees","Work 30s · Active Recovery 45s Skipping · Transition 15s"]]},
2:{name:"SCULPTED LEGS & CALF RATIO",rounds:4,rest:90,items:[
["Tempo Bodyweight Squats","reps",12,15,"3s lowering down → 1s bottom hold → 1s drive up","Work 50–60s · Active Recovery 45s Skipping · Transition 15s"],
["Bulgarian Split Squats","reps",8,8,"2s lowering down → 1s bottom hold → 2s drive up","8 reps/leg · Work 50s · Active Recovery 45s Skipping · Transition 15s"],
["Standing Single-Leg Calf Raise + Peak Hold","reps",12,12,"2s press up to toes → 2s peak squeeze at top → 2s lowering heels down","12 reps/leg · Work 45s · High-Knee Skipping 30s · Transition 15s"],
["Wall Sit Hold","time",45,45,"Continuous static contraction at 90-degree knee angle","Work 45s · Active Recovery 45s Skipping · Transition 15s"]]},
3:{name:"JOINT RECOVERY & PULLING PEAK",rounds:3,rest:60,items:[
["Chin-Ups (Underhand)","reps",4,6,"2s pull up → 2s squeeze biceps at top → 3s lowering down","Work 30s · Static Rest 60s"],
["Standing Bodyweight Good Mornings","reps",12,12,"3s hip hinge backward → 1s stretch hold at bottom → 2s drive hips forward","Work 35–40s · Static Rest 30s"],
["Standing Single-Leg Hip Hinge Hold","time",40,40,"Hold torso parallel to ground, 20s per leg","Work 40s total · Static Rest 30s"],
["Upright Mobility Focus","time",1200,1200,"Standing hip flexor lunges, wrist extensions, broomstick shoulder dislocations","20 minutes"]]},
4:{name:"ARMS, UPPER CHEST & OBLIQUE SCULPTING",rounds:4,rest:90,items:[
["Chin-Ups (Underhand)","reps",5,8,"2s pull up → 1s peak squeeze → 2s lowering down","Work 30s · Active Recovery 45s Skipping · Transition 15s"],
["Diamond Push-Ups","reps",8,10,"2s lowering chest to hands → 1s bottom hold → 2s press up","Work 30–35s · Active Recovery 45s Skipping · Transition 15s"],
["Seated T-Bar Row","reps",10,12,"2s pulling in → 1s hold/squeeze at chest → 2s lowering weight back out","Work 35–40s · Active Recovery 45s Skipping · Transition 15s"],
["Standing High-Knee Core Vacuum Hold","time",45,45,"Fully exhale → pull stomach to spine → drive knee up → hold static","Work 45s total · Active Recovery 45s Skipping · Transition 15s"]]},
5:{name:"UNILATERAL AESTHETICS & CONDITIONING",rounds:4,rest:90,items:[
["Assisted Single-Leg Squats","reps",5,5,"3s lowering down → 1s bottom hold → 2s drive up","5 reps/leg · Work 40s · Active Recovery 45s Skipping · Transition 15s"],
["Standing Single-Leg RDL","reps",8,10,"3s hinge down → 1s stretch hold → 2s drive upright","8–10 reps/leg · Work 50–60s · Active Recovery 45s Skipping · Transition 15s"],
["Standing Single-Leg Calf Iso-Hold","time",60,60,"Press to maximum height on toes and hold statically","60s total · 30s per leg · Transition 15s"],
["Jump Rope Speed Burst","time",60,60,"20s maximum speed sprint → 10s rest × 2 cycles","60s total"]]},
6:{name:"GREEK HERO FULL-BODY CIRCUIT",rounds:4,rest:120,items:[
["Pull-Ups or Chin-Ups","time",45,45,"2s pull → 1s hold → 2s lower","45s work · Transition 15s"],
["Bodyweight Squats","time",45,45,"2s down → 1s bottom hold → 1s up","45s work · Transition 15s"],
["Pike or Diamond Push-Ups","time",45,45,"2s down → 1s bottom hold → 1s up","45s work · Transition 15s"],
["Continuous Skipping","time",60,60,"Steady rhythm","60s work"],
["Hanging Knee Raise Hold","time",45,45,"Continuous static squeeze","45s work · Rest 2 minutes after full 5-exercise loop"]]},
7:{name:"COMPLETE RESET",rounds:0,rest:0,items:[
["Relaxed Walk","time",1800,1800,"Relaxed walking pace","30 minutes"],
["Standing Stretches","time",600,600,"Standing stretches","10 minutes"],
["Hydration & Sleep","time",0,0,"Recovery focus","Hydration and sleep"]]}
};

const DATAKEY="Workout Tracker",SETKEY="Workout Tracker Defaults",THEMEKEY="Workout Tracker Theme";let timers={};
function load(){try{return JSON.parse(localStorage.getItem(DATAKEY)||"[]")}catch{return[]}}
function store(x){localStorage.setItem(DATAKEY,JSON.stringify(x))}
function fmt(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function applyTheme(mode){document.body.classList.toggle("day",mode==="day");let b=document.getElementById("themeToggle");if(b)b.textContent=mode==="day"?"🌙 Night":"☀️ Day";let m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",mode==="day"?"#111827":"#020617")}
function toggleTheme(){let next=document.body.classList.contains("day")?"night":"day";localStorage.setItem(THEMEKEY,next);applyTheme(next)}
function defaults(){
 let d={};try{d=JSON.parse(localStorage.getItem(SETKEY)||"{}")}catch{}
 for(let day=1;day<=7;day++)for(let it of PROGRAM[day].items){
   let k=day+"|"+it[0];if(!(k in d))d[k]=it[1]==="reps"?4:it[2];
 }
 for(let day=1;day<=7;day++)d[day+"|roundRest"]??=PROGRAM[day].rest;
 d.transition??=15;d.activeRecovery??=45;return d;
}
function saveDefaults(d){localStorage.setItem(SETKEY,JSON.stringify(d))}
function adaptive(day,name,fallback){
 let a=load().filter(x=>x.day===day).sort((x,y)=>x.date.localeCompare(y.date));
 let list=a.map(x=>x.exercises?.[name]).filter(Boolean);if(!list.length)return fallback;
 let latest=list[list.length-1];
 if(latest.kind==="reps"){
   let done=0,skip=0;
   list.forEach(e=>e.sets.every(s=>s.done)?done++:skip++);
   return Math.max(1,fallback+Math.floor(done/3)-Math.floor(skip/2));
 }
 return latest.completed??fallback;
}
function adaptationInfo(day,name){
 let list=load().filter(x=>x.day===day).sort((x,y)=>x.date.localeCompare(y.date)).map(x=>x.exercises?.[name]).filter(e=>e?.kind==="reps");
 let done=0,skip=0;list.forEach(e=>e.sets.every(s=>s.done)?done++:skip++);
 return {done,skip,up:Math.floor(done/3),down:Math.floor(skip/2),net:Math.floor(done/3)-Math.floor(skip/2)};
}
function renderSettings(){
 let day=+document.getElementById('dayPick').value,d=defaults(),out="";
 PROGRAM[day].items.forEach((it,i)=>{let info=it[1]==="reps"?adaptationInfo(day,it[0]):null;out+=`<label>${it[0]} default (${it[1]==="reps"?"reps":"sec"})<input id="s${i}" type="number" min="1" value="${d[day+"|"+it[0]]}"></label>${info?`<div class="muted">Adaptation: done ${info.done} (+${info.up}) · skipped ${info.skip} (-${info.down}) · net ${info.net>=0?"+":""}${info.net}</div>`:""}`});
 out+=`<label>Round rest (sec)<input id="roundRest" type="number" min="1" value="${d[day+"|roundRest"]}"></label>
 <label>Transition (sec)<input id="transition" type="number" min="1" value="${d.transition}"></label>
 <label>Active recovery / skipping (sec)<input id="activeRecovery" type="number" min="1" value="${d.activeRecovery}"></label>`;
 document.getElementById('settings').innerHTML=out;
}
function saveDefaultSettings(){
 let day=+document.getElementById('dayPick').value,d=defaults();
 PROGRAM[day].items.forEach((it,i)=>d[day+"|"+it[0]]=Math.max(1,+document.getElementById("s"+i).value||1));
 d[day+"|roundRest"]=Math.max(1,+roundRest.value||1);d.transition=Math.max(1,+transition.value||1);d.activeRecovery=Math.max(1,+activeRecovery.value||1);
 saveDefaults(d);render();renderSettings();document.getElementById('msg').innerHTML='<div class="ok">✓ Default settings saved.</div>';
}
function render(){
 let day=+document.getElementById('dayPick').value,p=PROGRAM[day],d=defaults(),date=new Date().toISOString().slice(0,10),saved=load().find(x=>x.date===date&&x.day===day);
 document.getElementById('dayTitle').textContent=`Day ${day}: ${p.name}`;document.getElementById('dayMeta').textContent=p.rounds?`${p.rounds} rounds · Round rest ${d[day+"|roundRest"]} sec`:"Complete reset";
 let out="";
 p.items.forEach((it,i)=>{
   let name=it[0],def=d[day+"|"+name],ad=adaptive(day,name,def);
   if(it[1]==="reps"){
     let rows=saved?.exercises?.[name]?.sets||Array.from({length:p.rounds||1},()=>({reps:ad,done:false}));
     out+=`<div class="exercise"><h3>${name}</h3><div class="muted">Program: ${it[2]}–${it[3]} reps</div><div class="tempo"><b>Tempo:</b> ${it[4]}</div><div class="muted">${it[5]}</div>`;
     for(let r=0;r<(p.rounds||1);r++){let x=rows[r]||{reps:ad,done:false};out+=`<div class="setrow"><b>Set ${r+1}</b><label>Reps<input data-name="${encodeURIComponent(name)}" data-r="${r}" type="number" min="0" value="${x.reps}"></label><label>Done<br><input data-done="${encodeURIComponent(name)}" data-r="${r}" type="checkbox" ${x.done?"checked":""}></label></div>`}
     out+=`</div>`;
   }else{
     let cur=saved?.exercises?.[name]?.completed??ad;
     out+=`<div class="exercise"><h3>${name}</h3><div class="tempo"><b>Tempo:</b> ${it[4]}</div><div class="muted">${it[5]} · Default ${fmt(def)}</div>
     <div class="timerbox"><div class="timer" id="timer${i}">${fmt(cur)}</div><div class="row"><button onclick="startTimer(${i})">▶ Start</button><button class="alt" onclick="pauseTimer(${i})">⏸ Pause</button><button class="alt" onclick="resetTimer(${i},${def})">↻ Reset</button></div>
     <label>Completed seconds<input id="completed${i}" type="number" min="0" value="${cur}"></label><label>Done<br><input id="doneTime${i}" type="checkbox" ${saved?.exercises?.[name]?.done?"checked":""}></label></div></div>`;
   }
 });
 out+=`<div class="muted"><b>Transition:</b> ${d.transition}s · <b>Active recovery:</b> ${d.activeRecovery}s</div>`;
 document.getElementById('workout').innerHTML=out;
}
function startTimer(i){clearInterval(timers[i]);let el=document.getElementById("timer"+i),input=document.getElementById("completed"+i),cur=+input.value||0,end=Date.now()+cur*1000;timers[i]=setInterval(()=>{let x=Math.max(0,Math.ceil((end-Date.now())/1000));el.textContent=fmt(x);input.value=x;if(!x)clearInterval(timers[i])},250)}
function pauseTimer(i){clearInterval(timers[i])}
function resetTimer(i,s){clearInterval(timers[i]);document.getElementById("timer"+i).textContent=fmt(s);document.getElementById("completed"+i).value=s}
function saveWorkout(){
 let editId=document.getElementById('save').dataset.editId||"",parts=editId?editId.split("|"):null,day=parts?+parts[1]:+document.getElementById('dayPick').value,p=PROGRAM[day],date=parts?parts[0]:new Date().toISOString().slice(0,10),data={date,day,completedAt:new Date().toISOString(),exercises:{}};
 p.items.forEach((it,i)=>{let name=it[0];
   if(it[1]==="reps"){
     let sets=[...document.querySelectorAll(`[data-name="${encodeURIComponent(name)}"]`)].map((x,r)=>({reps:+x.value||0,done:document.querySelector(`[data-done="${encodeURIComponent(name)}"][data-r="${r}"]`).checked}));
     data.exercises[name]={kind:"reps",sets,target:[it[2],it[3]]};
   }else data.exercises[name]={kind:"time",completed:+document.getElementById("completed"+i).value||0,done:document.getElementById("doneTime"+i).checked,target:it[3]};
 });
 let a=load().filter(x=>!(x.date===date&&x.day===day));a.push(data);store(a);
 let saveBtn=document.getElementById('save'),cancel=document.getElementById('cancelEdit');
 if(editId){saveBtn.dataset.editId="";saveBtn.textContent='✓ DONE — SAVE WORKOUT';if(cancel)cancel.style.display='none';document.getElementById('msg').innerHTML='<div class="ok">✓ Updated selected day entry.</div>'}
 else document.getElementById('msg').innerHTML='<div class="ok">✓ Saved. Defaults adapt by +1 per 3 completed and -1 per 2 skipped sessions.</div>';
 render();renderSettings();renderHistory();renderStats();renderProgress();
}
function startEdit(date,day){
 document.getElementById('dayPick').value=day;render();renderSettings();
 let rec=load().find(x=>x.date===date&&x.day===day);if(!rec)return;
 let items=PROGRAM[day].items;
 Object.entries(rec.exercises).forEach(([name,e])=>{
   let idx=items.findIndex(it=>it[0]===name);if(idx<0)return;
   if(e.kind==="reps"){(e.sets||[]).forEach((s,r)=>{let i=document.querySelector(`[data-name="${encodeURIComponent(name)}"][data-r="${r}"]`),d=document.querySelector(`[data-done="${encodeURIComponent(name)}"][data-r="${r}"]`);if(i)i.value=s.reps;if(d)d.checked=!!s.done})}
   else{let c=document.getElementById("completed"+idx),d=document.getElementById("doneTime"+idx),t=document.getElementById("timer"+idx);if(c)c.value=e.completed??0;if(d)d.checked=!!e.done;if(t)t.textContent=fmt(e.completed??0)}
 });
 let saveBtn=document.getElementById('save'),cancel=document.getElementById('cancelEdit');
 saveBtn.dataset.editId=`${date}|${day}`;saveBtn.textContent=`✓ UPDATE ${date} (Day ${day})`;if(cancel)cancel.style.display='inline-block';
 document.getElementById('msg').innerHTML=`<div class="editing">Editing ${date} Day ${day}. Update values and press save.</div>`;
 window.scrollTo({top:0,behavior:'smooth'});
}
function addDemoData(){
 let now=new Date(),a=load();
 for(let i=20;i>=0;i--){
   let d=new Date(now);d.setDate(now.getDate()-i);let date=d.toISOString().slice(0,10),day=d.getDay()||7,p=PROGRAM[day],exercises={};
   p.items.forEach(it=>{let name=it[0];
     if(it[1]==="reps"){
       let rounds=p.rounds||1,base=Math.max(1,it[2]-2+Math.floor(Math.random()*5)),bias=.55+Math.random()*.35;
       let sets=Array.from({length:rounds},()=>{let reps=Math.max(1,base+Math.floor(Math.random()*3)-1),done=Math.random()<bias;return {reps,done}});
       exercises[name]={kind:"reps",sets,target:[it[2],it[3]]};
     }else{
       let target=it[3],done=Math.random()>.28,drop=Math.floor((target||60)*(.2+Math.random()*.5)),completed=done?target:Math.max(0,target-drop);
       exercises[name]={kind:"time",completed,done,target};
     }
   });
   let rec={date,day,completedAt:new Date(d.getTime()+(16+Math.floor(Math.random()*4))*3600*1000).toISOString(),exercises,demo:true};
   a=a.filter(x=>!(x.date===date&&x.day===day));a.push(rec);
 }
 store(a);document.getElementById('msg').innerHTML='<div class="ok">✓ Added 3 weeks of randomized demo data. Switch day and date range to inspect graphs.</div>';render();renderSettings();renderHistory();renderStats();renderProgress();
}
function renderHistory(){let a=load().sort((x,y)=>y.date.localeCompare(x.date));document.getElementById('history').innerHTML=a.length?a.map(x=>`<div class="history"><b>${x.date} — Day ${x.day}</b> <button class="alt" style="padding:4px 8px;font-size:12px" onclick="startEdit('${x.date}',${x.day})">Edit</button><br>${Object.entries(x.exercises).map(([n,e])=>e.kind==="reps"?`${n}: ${e.sets.map(s=>s.reps+(s.done?" ✓":"")).join(" / ")}`:`${n}: ${fmt(e.completed)}${e.done?" ✓":""}`).join("<br>")}</div>`).join(""):"<span class='muted'>No saved workouts.</span>"}
function renderStats(){let a=load(),sets=a.reduce((z,x)=>z+Object.values(x.exercises).reduce((q,e)=>q+(e.kind==="reps"?e.sets.length:0),0),0);document.getElementById('stats').innerHTML=`<div class="stat"><b>${a.length}</b>sessions</div><div class="stat"><b>${sets}</b>sets tracked</div><div class="stat"><b>${new Set(a.map(x=>x.day)).size}</b>days used</div>`}
function renderProgress(){
 let day=+(document.getElementById('progressDay')?.value||document.getElementById('dayPick').value),all=load().filter(x=>x.day===day).sort((x,y)=>x.date.localeCompare(y.date));
 let from=document.getElementById('fromDate')?.value||"",to=document.getElementById('toDate')?.value||"";
 if(from&&to&&from>to){let t=from;from=to;to=t;document.getElementById('fromDate').value=from;document.getElementById('toDate').value=to}
 let a=all.filter(x=>(!from||x.date>=from)&&(!to||x.date<=to));
 if(!a.length){document.getElementById('progress').innerHTML="<p class='muted'>No sessions in selected date range.</p>";return}
 let totals=a.reduce((z,x)=>{Object.values(x.exercises).forEach(e=>{if(e.kind==="reps"){let done=e.sets.filter(s=>s.done);z.done+=done.length;z.total+=e.sets.length}else{z.done+=(e.done?1:0);z.total+=1}});return z},{done:0,total:0});
 let pct=totals.total?Math.round(totals.done*100/totals.total):0,last=a[a.length-1],first=a[0],dayItems=PROGRAM[day].items,dayExercises=dayItems.map(it=>it[0]);
 let trendSelect=document.getElementById('trendExercise');
 let selectedSet=trendSelect?[...trendSelect.selectedOptions].map(o=>o.value).filter(v=>dayExercises.includes(v)):[...dayExercises];
 if(!selectedSet.length)selectedSet=[...dayExercises];
 let opts=dayExercises.map(n=>`<option ${selectedSet.includes(n)?"selected":""}>${n}</option>`).join(""),w=Math.max(340,Math.round(Math.max(320,a.length*62)*1.05));
 let colors=["#f59e0b","#60a5fa","#34d399","#a78bfa","#f472b6","#fb7185","#22d3ee"];
 let lines=selectedSet.map((name,idx)=>{let type=dayItems.find(it=>it[0]===name)?.[1]||"reps";let points=a.map(x=>{let e=x.exercises[name];if(!e)return 0;if(type==="reps"){let done=e.kind==="reps"?e.sets.filter(s=>s.done).map(s=>s.reps):[];return done.length?Math.round(done.reduce((s,v)=>s+v,0)/done.length):0}return e.kind==="time"?(e.completed||0):0});let unit=type==="reps"?"reps":"sec",max=Math.max(1,...points),coords=points.map((v,i)=>`${20+i*(w-40)/Math.max(1,points.length-1)},${160-(v/max)*130}`).join(" "),dots=points.map((v,i)=>`<circle cx="${20+i*(w-40)/Math.max(1,points.length-1)}" cy="${160-(v/max)*130}" r="4" fill="${colors[idx%colors.length]}"><title>${a[i].date}: ${unit==="reps"?v+" reps":fmt(v)}</title></circle>`).join("");return {name,type,color:colors[idx%colors.length],coords,dots,unit}});
 let labs=a.map((t,i)=>`<text x="${20+i*(w-40)/Math.max(1,Math.max(1,a.length-1))}" y="178" font-size="10" fill="var(--muted)" text-anchor="middle">${t.date.slice(5).replace("-","/")}</text>`).join(""),legend=lines.map(l=>`<span><i class="swatch" style="background:${l.color}"></i>${l.name} (${l.type==="reps"?"reps":"mm:ss"})</span>`).join(" ");
 document.getElementById('progress').innerHTML=`<div class="ok"><b>Day ${day} progress:</b> ${totals.done}/${totals.total} items done (${pct}%) across ${a.length} session${a.length>1?"s":""}. Latest: ${last.date}</div><div class="trendbox"><label>Exercise moving graph (multi-select)<select id="trendExercise" multiple size="${Math.min(6,Math.max(3,dayExercises.length))}">${opts}</select></label><div class="linechart"><svg width="${w}" height="185" viewBox="0 0 ${w} 185"><line x1="20" y1="160" x2="${w-20}" y2="160" stroke="var(--line)"/><line x1="20" y1="20" x2="20" y2="160" stroke="var(--line)"/>${lines.map(l=>`<polyline fill="none" stroke="${l.color}" stroke-width="3" points="${l.coords}"/>${l.dots}`).join("")}${labs}</svg></div><div class="legend">${legend}</div></div><div class="muted">Trend window: ${first.date} → ${last.date}. Date range: ${from||first.date} to ${to||last.date}.</div>`+a.map(x=>`<p><b>${x.date}</b><br>${Object.entries(x.exercises).map(([n,e])=>e.kind==="reps"?`${n}: ${e.sets.map(s=>s.reps+(s.done?"✓":"")).join(" / ")}`:`${n}: ${fmt(e.completed)}${e.done?" ✓":""}`).join(" · ")}</p>`).join("");
 let sel=document.getElementById('trendExercise');if(sel)sel.onchange=renderProgress;
}
function init(){

 document.getElementById('progressDay').innerHTML=Object.entries(PROGRAM).map(([d])=>`<option value="${d}">Day${d}</option>`).join("");
 let dow=new Date().getDay(),todayDay=dow===0?7:dow;document.getElementById('dayPick').value=todayDay;document.getElementById('progressDay').value=todayDay;

 document.getElementById('export').onclick=async()=>{let now=new Date(),dd=String(now.getDate()).padStart(2,"0"),mm=String(now.getMonth()+1).padStart(2,"0"),yyyy=now.getFullYear(),day=+document.getElementById('dayPick').value,filename=`Workout_Day${day}_${dd}_${mm}_${yyyy}.json`,payload=JSON.stringify({workouts:load(),defaults:defaults()},null,2),msg=document.getElementById('msg');if(window.showSaveFilePicker){try{let h=await window.showSaveFilePicker({suggestedName:filename,types:[{description:"JSON",accept:{"application/json":[".json"]}}]}),w=await h.createWritable();await w.write(payload);await w.close();if(msg)msg.innerHTML='<div class="ok">✓ Exported using save picker.</div>';return}catch(e){if(e?.name==="AbortError")return}}let b=new Blob([payload],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);if(msg)msg.innerHTML='<div class="muted">Save picker not supported here. File downloaded using browser fallback.</div>'};
 document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{try{let f=e.target.files?.[0];if(!f)return;let x=JSON.parse(await f.text());if(Array.isArray(x)){store(x)}else{store(x.workouts||[]);if(x.defaults)localStorage.setItem(SETKEY,JSON.stringify(x.defaults))}alert("Imported");location.reload()}catch{alert("Invalid backup")}};
 let now=new Date(),fromDefault=new Date(now);fromDefault.setMonth(fromDefault.getMonth()-1);document.getElementById('fromDate').value=fromDefault.toISOString().slice(0,10);document.getElementById('toDate').value=now.toISOString().slice(0,10);
 document.getElementById('fromDate').onchange=renderProgress;document.getElementById('toDate').onchange=renderProgress;

 document.getElementById('clear').onclick=()=>{if(confirm("Delete all workout history and settings?")){localStorage.removeItem(DATAKEY);localStorage.removeItem(SETKEY);location.reload()}};
 if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
 render();renderSettings();renderHistory();renderStats();renderProgress();
}
init();
</script></body></html>
